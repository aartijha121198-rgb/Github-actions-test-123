name: My first CI/CD pipeline
on:
 # push:
 #     branches:
 #    -  main
  #schedule:
   # - cron: "5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  
jobs:
  job1:
    name: job1
    needs: job2
    runs-on: ubuntu-latest      #Github hosted runner
    steps:
      - name: Running command job1
        run: echo "Hello world"
      - name: Check os-release job1
        run: cat /etc/os-release
      - name: sleeping job1
        run: sleep 5

  job2:
    name: job2
    runs-on: macos-14     #Github hosted runner
    steps:
    - name: Running command sleeping mode job2
      run: |
        echo "Hello world job2"
        ls -ltr
        hostname    
   
    - name:  chcekout
      uses: actions/checkout@v4
 
    - name: validate
      run: |
        echo ls -ltr  >> myArtifact.txt

    - name: Upload Single file
      uses: actions/upload-artifact@v5.0.0
      with:
         name: single_file
         path: ./myArtifact.txt

    -  name: Upload from directory
       uses: actions/upload-artifact@v5.0.0
       with:
         name: directory_artifacts
         path: artifacts/
     
    -  name: Upload from multiple paths
       uses: actions/upload-artifact@v5.0.0
       with:
         name: multiple_paths
         path: |
           ./myArtifact.txt
            artifacts/

    - name: Upload from multiple paths with exclusions
      uses: actions/upload-artifact@v5.0.0
      with:
        name: multiple_paths_with_exclusions
        path: |
          ./myArtifact.txt
          artifacts/
          !**/hostname.txt
          
            hostname
    
        
