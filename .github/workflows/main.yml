name: My first CI/CD pipeline
on:
 # push:
 #     branches:
 #    -  main
  #schedule:
   # - cron: "5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  
jobs:
  job1:
    name: job1
    needs: job2
    runs-on: ubuntu-latest      #Github hosted runner
    steps:
      - name: Running command job1
        run: echo "Hello world"
      - name: Check os-release job1
        run: cat /etc/os-release
      - name: sleeping job1
        run: sleep 5

  job2:
    name: job2
    runs-on: macos-14     #Github hosted runner
    steps:
    - name: Running command sleeping mode job2
      run: |
        echo "Hello world job2"
        ls -ltr
        hostname    
   
    - name:  chcekout
      uses: actions/checkout@v4
 
    - name: validate
      run: |
        echo ls -ltr  >> abc.txt
        hostname

    - name: upload artifcat
      uses: actions/upload-artifact@v5.0.0
      with:
        name: Upload file manually
        path: ./abc.txt
    

    
