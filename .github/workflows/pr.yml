name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Print Branch Info
        run: |
          echo "Head Branch = ${{ github.head_ref }}"
          echo "Base Branch = ${{ github.base_ref }}"

      - name: Validate
        run: |
          echo "Running PR Validation"

      - name: List files
        run: ls -ltr
